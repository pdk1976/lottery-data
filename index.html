<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#060b17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>科创预测分析系统</title>
<style>
/* ============================================================
   科创预测分析系统 · 深色科技风视觉 v2.0
   全部类名/ID 与 JS 逻辑完全兼容，仅升级视觉表现
   ============================================================ */
:root{
  --bg0:#060b17; --bg1:#0b1428; --bg2:#101d3a;
  --card:rgba(148,178,255,.055); --card2:rgba(148,178,255,.09);
  --line:rgba(160,190,255,.13); --line2:rgba(160,190,255,.22);
  --text:#f4f8ff; --sub:#a9bce0; --dim:#7d93bd;
  --red:#ff5d6c; --blue:#4f8cff; --purple:#8a6bff; --cyan:#35d0e8;
  --gold:#f0b24a; --green:#34d399; --accent:#4f8cff;
  --glow-r:rgba(255,93,108,.5); --glow-b:rgba(79,140,255,.5); --glow-g:rgba(240,178,74,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  background:var(--bg0);color:var(--text);
  font-family:'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',system-ui,sans-serif;
  font-size:14px;line-height:1.55;
  min-height:100%;overflow-x:hidden;
}
/* 深空背景：多层光晕 + 微网格 */
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(900px 500px at 85% -5%, rgba(79,140,255,.18), transparent 60%),
    radial-gradient(700px 450px at -10% 25%, rgba(138,107,255,.14), transparent 60%),
    radial-gradient(800px 500px at 55% 110%, rgba(53,208,232,.10), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg0) 55%,#080e1e);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(130,160,255,.035) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(130,160,255,.035) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 80%);
}
#app{max-width:520px;margin:0 auto;padding:0 0 76px;position:relative;}
/* ===== 顶栏 ===== */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(8,16,34,.95),rgba(10,18,38,.82));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  padding:14px 18px 12px;
  display:flex;align-items:center;gap:12px;
}
header::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(79,140,255,.6),rgba(138,107,255,.6),transparent);
}
header .hd-mark{
  width:38px;height:38px;flex-shrink:0;border-radius:11px;
  background:linear-gradient(135deg,#2b6bff,#8a6bff 60%,#c65bff);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#fff;
  box-shadow:0 0 0 1px rgba(140,170,255,.4), 0 4px 18px rgba(79,140,255,.5), inset 0 1px 0 rgba(255,255,255,.35);
  position:relative;overflow:hidden;
}
header .hd-mark::before{
  content:'';position:absolute;top:0;left:8%;right:8%;height:1px;
  background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.85;
}
header .hd-mark::after{
  content:'';position:absolute;inset:-5px;border-radius:15px;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 68%,rgba(140,210,255,.9) 86%,transparent 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));
  animation:spin 3.4s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
header .hd-txt{min-width:0;}
header h1{
  font-size:16.5px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(90deg,#fff 25%,#9cc4ff 70%,#b9a5ff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 18px rgba(120,170,255,.35);
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}
header h1 .engine{
  font-size:8.5px;font-weight:700;letter-spacing:1.5px;color:#7fd8ff;
  border:1px solid rgba(127,216,255,.35);border-radius:20px;padding:1px 7px;
  background:rgba(53,208,232,.08);
  -webkit-text-fill-color:#7fd8ff;
  text-shadow:0 0 10px rgba(53,208,232,.7);
  animation:pulseGlow 2.6s ease-in-out infinite;
}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 4px rgba(53,208,232,.25);}50%{box-shadow:0 0 12px rgba(53,208,232,.75);}}
header .sub{font-size:11px;color:var(--sub);margin-top:3px;opacity:.95;letter-spacing:.2px;}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px;vertical-align:middle;box-shadow:0 0 8px rgba(52,211,153,.8);}
.sync-dot.off{background:var(--dim);box-shadow:none;}
/* ===== 导航 ===== */
nav{
  position:sticky;top:0;z-index:19;
  display:flex;gap:4px;padding:8px 10px 0;
  background:rgba(8,15,32,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
nav button{
  flex:1;padding:8px 0 10px;border:none;background:transparent;
  font-size:12.5px;color:var(--sub);font-family:inherit;cursor:pointer;
  border-radius:12px 12px 0 0;transition:all .25s;position:relative;font-weight:500;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
nav button i{font-style:normal;font-size:15px;line-height:1;opacity:.72;transition:all .25s;}
nav button.on{
  color:#fff;font-weight:700;
  background:linear-gradient(180deg,rgba(79,140,255,.18),rgba(10,18,38,0));
  text-shadow:0 0 14px rgba(120,170,255,.7);
}
nav button.on i{opacity:1;transform:translateY(-1px);filter:drop-shadow(0 0 6px rgba(120,180,255,.9));}
nav button::after{
  content:'';position:absolute;left:22%;right:22%;bottom:0;height:2.5px;border-radius:2px;
  background:linear-gradient(90deg,#4f8cff,#8a6bff);opacity:0;transform:scaleX(.3);transition:all .3s;
  box-shadow:0 0 10px rgba(120,150,255,.9);
}
nav button.on::after{opacity:1;transform:scaleX(1);}
main{padding:14px 14px 10px;}
.tab{display:none;} .tab.on{display:block;animation:fadeIn .28s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
/* ===== 卡片 ===== */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;padding:13px 15px;margin-bottom:13px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 4px 20px rgba(3,8,20,.35);
  transition:border-color .2s;
}
.card h2{font-size:14.5px;font-weight:800;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;color:var(--text);}
.card h2 .tag{font-size:10.5px;font-weight:500;color:var(--sub);background:rgba(148,178,255,.08);padding:2px 8px;border-radius:20px;}
.switch{display:flex;background:rgba(10,18,38,.7);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:13px;backdrop-filter:blur(6px);}
.switch button{flex:1;padding:9px 0;border:none;border-radius:9px;background:transparent;font-size:14px;color:var(--sub);font-family:inherit;cursor:pointer;transition:all .2s;font-weight:600;}
.switch button.on{
  background:linear-gradient(135deg,#2b4a86,#1f3560);color:#fff;font-weight:700;
  box-shadow:0 2px 12px rgba(79,140,255,.35), inset 0 0 0 1px rgba(120,170,255,.35);
}
/* ===== 主推卡 ===== */
.maincard{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(79,140,255,.13),rgba(10,18,38,.4) 45%,rgba(240,178,74,.08));
  border:1px solid rgba(120,170,255,.35);
  box-shadow:0 0 0 1px rgba(79,140,255,.08), 0 8px 32px rgba(20,40,90,.45), inset 0 1px 0 rgba(255,255,255,.06);
}
.maincard .balls .ball{width:44px;height:44px;font-size:18px;box-shadow:0 4px 16px rgba(79,140,255,.5), inset 0 -3px 5px rgba(0,0,0,.28);}
  .maincard::before{content:'★ 主推';position:absolute;top:0;right:0;background:linear-gradient(135deg,#f0b24a,#e08a1e);color:#1a1205;font-size:10px;padding:4px 12px;border-radius:0 0 0 12px;font-weight:800;letter-spacing:.5px;box-shadow:0 2px 8px rgba(240,178,74,.4);}
.maincard::after{
  content:'';position:absolute;top:-60%;right:-30%;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(79,140,255,.22),transparent 65%);pointer-events:none;
}
.period-line{font-size:12.5px;color:var(--sub);margin-bottom:8px;display:flex;align-items:center;gap:6px;font-weight:600;}
.period-line::before{content:'';width:4px;height:12px;border-radius:2px;background:linear-gradient(180deg,#4f8cff,#8a6bff);}
.balls{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0;position:relative;z-index:1;}
.ball{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15.5px;font-weight:800;color:#fff;
  border:1px solid rgba(255,255,255,.3);
}
.ball.r{
  background:radial-gradient(circle at 32% 28%,#ffb3b8,#ff5d6c 55%,#c22a3a);
  box-shadow:0 3px 12px var(--glow-r), inset 0 -3px 5px rgba(0,0,0,.28);
}
.ball.b{
  background:radial-gradient(circle at 32% 28%,#bcd8ff,#4f8cff 55%,#2855c9);
  box-shadow:0 3px 12px var(--glow-b), inset 0 -3px 5px rgba(0,0,0,.28);
}
.ball.s{
  background:radial-gradient(circle at 32% 28%,#ffe3ad,#f0b24a 55%,#c07f1a);
  box-shadow:0 3px 10px var(--glow-g), inset 0 -3px 5px rgba(0,0,0,.25);
  width:31px;height:31px;font-size:12.5px;
}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px;margin-top:10px;position:relative;z-index:1;}
.meta-item{background:rgba(148,178,255,.07);border:1px solid rgba(148,178,255,.09);border-radius:10px;padding:6px 9px;font-size:10.5px;color:var(--sub);}
.meta-item b{display:block;font-size:12px;color:var(--text);margin-top:2px;font-weight:700;}
/* ===== 模型列表 ===== */
.model-list .mrow{
  display:flex;justify-content:space-between;align-items:center;padding:9px 2px;
  border-bottom:1px solid rgba(148,178,255,.08);cursor:pointer;transition:background .15s;border-radius:8px;
}
.model-list .mrow:last-child{border-bottom:none;}
.model-list .mrow:hover{background:rgba(148,178,255,.05);}
.mrow .mname{font-size:12px;color:var(--sub);width:100px;flex-shrink:0;position:relative;font-weight:500;}
.mrow .mname:after{content:'▸';position:absolute;right:-2px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--dim);transition:transform .2s;}
.mrow.open .mname:after{transform:translateY(-50%) rotate(90deg);}
.mrow .mballs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.mrow .mball{
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;border:1px solid rgba(255,255,255,.25);
}
.mrow .mball.r{background:radial-gradient(circle at 32% 28%,#ff9aa2,#e04a58 60%,#a92a38);box-shadow:0 2px 8px rgba(255,93,108,.35);}
.mrow .mball.b{background:radial-gradient(circle at 32% 28%,#9cc0ff,#3f76e0 60%,#2a4fa8);box-shadow:0 2px 8px rgba(79,140,255,.35);}
.mdetail{display:none;padding:10px 12px;background:rgba(148,178,255,.06);border:1px solid rgba(148,178,255,.1);border-radius:10px;margin:6px 0;font-size:11px;color:var(--sub);line-height:1.65;}
.mrow.open+.mdetail{display:block;animation:fadeIn .2s ease;}
.mdetail .mstrat{font-weight:700;color:#7fb0ff;margin-bottom:4px;}
.mdetail .mlogic{color:var(--sub);margin-bottom:6px;}
.mdetail .mstats{display:flex;flex-wrap:wrap;gap:6px;}
.mdetail .mstat{background:rgba(10,18,38,.6);padding:3px 9px;border-radius:7px;border:1px solid rgba(148,178,255,.12);}
/* ===== 复式 ===== */
#tab-fushi .mball{display:inline-flex;width:27px;height:27px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-right:5px;vertical-align:middle;border:1px solid rgba(255,255,255,.2);}
#tab-fushi .mball.r{background:radial-gradient(circle at 32% 28%,#ff9aa2,#e04a58 60%,#a92a38);}
#tab-fushi .mball.b{background:radial-gradient(circle at 32% 28%,#9cc0ff,#3f76e0 60%,#2a4fa8);}
.combo-group{margin:11px 0;padding:11px 12px;background:rgba(148,178,255,.05);border:1px solid var(--line);border-radius:12px;}
.combo-title{font-weight:800;font-size:14px;margin-bottom:6px;color:var(--text);}
/* ===== 历史 ===== */
.his-row{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid rgba(148,178,255,.08);font-size:12px;}
.his-row:last-child{border-bottom:none;}
.his-row .p{color:var(--sub);width:52px;flex-shrink:0;font-weight:600;}
.his-row .balls{display:flex;gap:4px;margin:0;flex-wrap:wrap;}
.his-row .hball{
  width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.2);
}
.his-row .hball.r{background:radial-gradient(circle at 32% 28%,#f08b93,#d8404e 60%,#98232f);}
.his-row .hball.b{background:radial-gradient(circle at 32% 28%,#8cb2f5,#3568c9 60%,#24498f);}
.freq-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.fcell{width:31px;height:31px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.15);}
/* ===== 回测核验 ===== */
.bar-row{display:flex;align-items:center;gap:9px;margin:8px 0;}
.bar-row .nm{width:68px;font-size:12px;color:var(--sub);flex-shrink:0;text-align:right;font-weight:500;}
.bar-track{flex:1;height:18px;background:rgba(10,18,38,.7);border-radius:9px;overflow:hidden;border:1px solid rgba(148,178,255,.08);}
.bar-fill{height:100%;border-radius:9px;background:linear-gradient(90deg,#6f9bff,#4f8cff);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;font-weight:700;color:#fff;min-width:30px;box-shadow:0 0 10px rgba(79,140,255,.4);}
.bar-fill.top{background:linear-gradient(90deg,#f5c86e,#f0b24a);box-shadow:0 0 10px rgba(240,178,74,.4);}
.sig-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
.sig-table th,.sig-table td{padding:7px 4px;text-align:left;border-bottom:1px solid rgba(148,178,255,.09);}
.sig-table th{color:var(--sub);font-weight:600;font-size:11px;}
.ok{color:#34d399;font-weight:700;} .no{color:#ff5d6c;font-weight:700;}
.fb-box{padding:10px 12px;background:rgba(148,178,255,.08);border:1px solid rgba(148,178,255,.14);border-radius:10px;margin:7px 0;font-size:13px;}
.fb-box .fb-top{display:flex;justify-content:space-between;color:var(--sub);margin-bottom:4px;}
/* ===== 关于 ===== */
/* ===== 关于(可折叠卡片) ===== */
.about-card-h{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;padding:3px 0;border-radius:8px;}
.about-card-h:active{opacity:.7;}
.about-card-h h2{margin:0;flex:1;}
.about-caret{display:inline-block;width:16px;height:16px;line-height:14px;text-align:center;border:1px solid rgba(148,178,255,.35);border-radius:4px;color:var(--acc,#8aa8ff);font-size:11px;transition:transform .2s;flex:none;}
.about-card.collapsed .about-caret{transform:rotate(-90deg);}
.about-card.collapsed .about-card-b{display:none;}
.about-card-b{animation:aboutFade .2s ease;}
@keyframes aboutFade{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:none;}}

.about-line{margin:9px 0;font-size:13px;color:var(--sub);}
.about-line b{color:var(--text);}
.vm-stage{background:rgba(148,178,255,.06);border:1px solid rgba(148,178,255,.1);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--sub);margin-bottom:9px;line-height:1.65;}
.note{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.7;}
/* ===== 选号 ===== */
.pick-grid{display:flex;flex-wrap:wrap;gap:7px;}
.pick{
  width:37px;height:37px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;border:1px solid rgba(148,178,255,.25);
  background:rgba(148,178,255,.08);color:var(--sub);cursor:pointer;user-select:none;transition:all .18s;
}
.pick.r.on{
  background:radial-gradient(circle at 32% 28%,#ff8a93,#e04a58 60%,#a92a38);border-color:#ff7a86;color:#fff;
  box-shadow:0 3px 10px rgba(255,93,108,.4);transform:scale(1.06);
}
.pick.b.on{
  background:radial-gradient(circle at 32% 28%,#8cb2f5,#3f76e0 60%,#2a4fa8);border-color:#7aa5f5;color:#fff;
  box-shadow:0 3px 10px rgba(79,140,255,.4);transform:scale(1.06);
}
.pickline{display:flex;align-items:flex-start;gap:9px;margin:9px 0;}
.pickline .lab{width:64px;font-size:13px;color:var(--sub);flex-shrink:0;padding-top:9px;font-weight:700;}
.sel-btns{display:flex;gap:9px;margin-top:12px;}
.sel-btn{
  flex:1;padding:11px 0;border:none;border-radius:12px;cursor:pointer;font-size:14px;font-family:inherit;
  background:rgba(148,178,255,.1);color:var(--text);font-weight:600;transition:all .2s;
  border:1px solid rgba(148,178,255,.15);
}
.sel-btn:active{transform:scale(.97);}
.sel-btn.p{
  background:linear-gradient(135deg,#3f76e0,#2b4a86);color:#fff;font-weight:700;
  border:none;box-shadow:0 4px 16px rgba(79,140,255,.4);
}
/* ===== 组合票 ===== */
.combo-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
.ctab{padding:5px 13px;border:1px solid rgba(148,178,255,.22);border-radius:16px;font-size:12px;background:rgba(148,178,255,.05);color:var(--sub);cursor:pointer;font-family:inherit;transition:all .2s;}
.ctab.on{background:linear-gradient(135deg,#4f8cff,#8a6bff);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 3px 12px rgba(79,140,255,.4);}
.combo-sub{font-size:12px;color:var(--sub);margin-bottom:7px;font-weight:600;}
.combo-row{display:flex;align-items:center;gap:2px;padding:4px 0;font-size:12px;flex-wrap:wrap;line-height:1.8;color:var(--text);border-bottom:1px dashed rgba(148,178,255,.1);}
.combo-row:last-child{border-bottom:none;}
.cno{display:inline-block;min-width:20px;color:var(--dim);font-size:11px;font-weight:600;}
.combo-pane .mball{display:inline-flex;width:23px;height:23px;border-radius:50%;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;margin-right:3px;border:1px solid rgba(255,255,255,.2);}
.combo-pane .mball.r{background:radial-gradient(circle at 32% 28%,#f08b93,#d8404e 60%,#98232f);}
.combo-pane .mball.b{background:radial-gradient(circle at 32% 28%,#8cb2f5,#3568c9 60%,#24498f);}
.cplus{color:var(--dim);margin:0 5px;font-weight:700;}
/* ===== 预测栏 各模型/融合 号码球（v1.6.8：修复无样式纯文本问题+红蓝圆球） ===== */
#tab-predict .mball{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800;margin-right:3px;border:1px solid rgba(255,255,255,.25);box-sizing:border-box;}
#tab-predict .mball.r{background:radial-gradient(circle at 32% 28%,#ff9aa2,#e04a58 60%,#a92a38);box-shadow:0 1px 6px rgba(255,93,108,.35);}
#tab-predict .mball.b{background:radial-gradient(circle at 32% 28%,#9cc0ff,#3f76e0 60%,#2a4fa8);box-shadow:0 1px 6px rgba(79,140,255,.35);}
/* ===== 自设条件选号 ===== */
.cond-form{padding:9px 0;}
.cond-group{margin-bottom:9px;padding-bottom:7px;border-bottom:1px dashed rgba(148,178,255,.12);}
.cond-group:last-child{border-bottom:none;}
.cond-group-title{font-size:12px;font-weight:700;color:#7fb0ff;margin-bottom:5px;padding-left:2px;}
.cond-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.cond-row label{width:70px;font-size:13px;color:var(--sub);flex-shrink:0;font-weight:500;}
.cond-input{flex:1;padding:8px 11px;border:1px solid rgba(148,178,255,.22);border-radius:9px;font-size:13px;background:rgba(10,18,38,.6);color:var(--text);font-family:inherit;}
.cond-input:focus{outline:none;border-color:#4f8cff;box-shadow:0 0 0 2px rgba(79,140,255,.2);}
.cond-input::placeholder{color:var(--dim);}
.cond-tip{font-size:11px;color:var(--dim);padding:4px 0;line-height:1.5;}
.cond-results{margin-top:13px;}
.cond-result-row{display:flex;align-items:center;gap:4px;padding:8px 0;border-bottom:1px dashed rgba(148,178,255,.1);font-size:12px;flex-wrap:wrap;}
.cond-result-row .mball{display:inline-flex;width:25px;height:25px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-right:2px;border:1px solid rgba(255,255,255,.2);}
.cond-result-row .mball.r{background:radial-gradient(circle at 32% 28%,#f08b93,#d8404e 60%,#98232f);}
.cond-result-row .mball.b{background:radial-gradient(circle at 32% 28%,#8cb2f5,#3568c9 60%,#24498f);}
.cond-add{margin-left:auto;padding:5px 11px;font-size:11px;background:linear-gradient(135deg,rgba(79,140,255,.3),rgba(138,107,255,.25));color:#bcd8ff;border:1px solid rgba(120,170,255,.35);border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;}
.cond-err{padding:13px;color:#ff8591;font-size:13px;text-align:center;background:rgba(255,93,108,.08);border-radius:10px;border:1px solid rgba(255,93,108,.25);}
/* ===== 模型共识 ===== */
.consensus-high{padding:8px 0;font-size:14px;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600;}
.consensus-high .mball{
  display:inline-flex;width:29px;height:29px;border-radius:50%;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;
  background:radial-gradient(circle at 32% 28%,#ff8a93,#e04a58 60%,#a92a38);
  box-shadow:0 2px 10px rgba(255,93,108,.5), inset 0 -2px 4px rgba(0,0,0,.25);
}
.consensus-bar{margin-top:9px;}
.cbar-row{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px;}
.cbar-num{width:20px;text-align:right;font-weight:700;color:var(--sub);}
.cbar-track{flex:1;height:14px;background:rgba(10,18,38,.7);border-radius:7px;overflow:hidden;border:1px solid rgba(148,178,255,.08);}
.cbar-fill{height:100%;border-radius:7px;transition:width .3s;}
.cbar-fill.hi{background:linear-gradient(90deg,#ff5d6c,#f0b24a);box-shadow:0 0 8px rgba(255,93,108,.4);}
.cbar-fill.mid{background:linear-gradient(90deg,#f0b24a,#f5c86e);}
.cbar-fill.lo{background:#33456b;}
.cbar-cnt{width:32px;font-size:10px;color:var(--dim);}
/* ===== 徽标/权重 ===== */
.wtag{display:inline-block;margin-left:6px;padding:2px 7px;font-size:10px;color:#0d1730;background:linear-gradient(135deg,#f5c86e,#f0b24a);border-radius:8px;vertical-align:1px;font-weight:800;box-shadow:0 2px 6px rgba(240,178,74,.35);}
.wtag:before{content:'★';margin-right:1px;}
/* ===== Toast / 进度 / 下拉刷新 ===== */
.toast{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(14,24,48,.95);color:#fff;padding:11px 20px;border-radius:22px;font-size:12.5px;
  z-index:999;box-shadow:0 6px 24px rgba(0,0,0,.5), inset 0 0 0 1px rgba(148,178,255,.2);
  opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;
  backdrop-filter:blur(10px);
}
.toast.show{opacity:1;}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13px;border-bottom:1px solid rgba(148,178,255,.08);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .lbl{color:var(--text);}
.toggle-row .desc{font-size:11px;color:var(--sub);display:block;margin-top:2px;}
.switch2{position:relative;width:46px;height:25px;background:#2a3a5e;border-radius:13px;cursor:pointer;transition:background .2s;flex-shrink:0;border:1px solid rgba(148,178,255,.2);}
.switch2.on{background:linear-gradient(135deg,#4f8cff,#8a6bff);}
.switch2::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.switch2.on::after{left:23px;}
.pick.sync-hint{box-shadow:0 0 0 2px var(--gold) inset;}
#pull-refresh{position:fixed;top:0;left:0;right:0;height:0;overflow:hidden;background:rgba(9,16,34,.95);backdrop-filter:blur(8px);transition:height .2s;z-index:999;display:flex;align-items:center;justify-content:center;font-size:12px;color:#7fb0ff;border-bottom:1px solid var(--line);}
#pull-refresh .pr-arrow{display:inline-block;margin-right:6px;transition:transform .2s;}
#sync-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#4f8cff,#8a6bff,#f0b24a);z-index:1000;transition:width .3s;width:0;box-shadow:0 0 10px rgba(79,140,255,.8);}
.sync-status{font-size:11px;color:var(--sub);margin-top:2px;}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:22px 0;}
.footer-note{
  position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
  background:rgba(9,16,34,.92);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:8px 12px;
  font-size:11px;color:var(--dim);text-align:center;letter-spacing:.5px;
}
/* ===== 多彩文字体系 v12 ===== */
.c-gold.c-gold{color:#ffc75a;font-weight:700;}
.c-cyan.c-cyan{color:#4fd8f0;font-weight:700;}
.c-blue.c-blue{color:#8ab4ff;font-weight:700;}
.c-purple.c-purple{color:#c3a8ff;font-weight:700;}
.c-green.c-green{color:#4ade80;font-weight:700;}
.c-orange.c-orange{color:#ffb366;font-weight:700;}
.c-pink.c-pink{color:#ff9ecf;font-weight:700;}
.c-red.c-red{color:#ff7d8a;font-weight:700;}
.c-dim2.c-dim2{color:#9db4de;font-weight:600;}
.c-grad-gold.c-grad-gold{background:linear-gradient(135deg,#ffe29a,#f5b93f 55%,#f08a1e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;}
.c-grad-blue.c-grad-blue{background:linear-gradient(135deg,#a8d0ff,#4f8cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;}
.mn-bayes.mn-bayes{color:#4fd8f0;font-weight:800;}
.mn-markov.mn-markov{color:#7aa5f5;font-weight:800;}
.mn-lstm.mn-lstm{color:#c3a8ff;font-weight:800;}
.mn-stats.mn-stats{color:#4ade80;font-weight:800;}
.mn-ai.mn-ai{color:#ffb366;font-weight:800;}
.mn-fusion.mn-fusion{color:#ff9ecf;font-weight:800;}
.mn-engine.mn-engine{color:#ffc75a;font-weight:800;}
.mrow .mname{font-size:13.5px;}
</style>
</head>
<body>
<div id="sync-progress"></div><div id="pull-refresh" style="display:none;"><span class="pr-arrow">↓</span><span id="pr-text">下拉刷新</span></div>
<div id="app">
<header>
  <div class="hd-mark">科</div>
  <div class="hd-txt">
    <h1>科创预测分析系统 <em class="engine">AI&nbsp;ENGINE</em></h1>
    <div class="sub" id="hd-sub">加载中…</div>
  </div>
</header>
<div id="upd-banner" style="display:none;background:rgba(240,178,74,.12);color:#f5c86e;font-size:12px;padding:7px 12px;text-align:center;border-bottom:1px solid rgba(240,178,74,.25);"><span id="upd-banner-text"></span><a style="margin-left:8px;color:#3b6fd4;text-decoration:none;" onclick="show('about')">去查看</a></div>
<nav id="nav">
  <button class="on" data-t="pred"><i>◈</i>预测推荐</button>
  <button data-t="judge10"><i>◎</i>10维研判</button>
  <button data-t="select"><i>✦</i>自主选号</button>
  <button data-t="hist"><i>▣</i>历史开奖</button>
  <button data-t="btverify"><i>◉</i>回测核验</button>
  <button data-t="about"><i>⌬</i>关于</button>
</nav>
<main>
  <section id="tab-pred" class="tab on"></section>
  <section id="tab-judge10" class="tab"></section>
  <section id="tab-fushi" class="tab"></section>
  <section id="tab-select" class="tab"></section>
  <section id="tab-hist" class="tab"></section>
  <section id="tab-btverify" class="tab"></section>
  <section id="tab-about" class="tab"></section>
</main>
<div class="footer-note">理性购彩 · 数据仅供研究参考</div>
</div>

<script>
var DATA=null, G='dlt';
var HAS_NATIVE_BRIDGE=(typeof AndroidBridge!=='undefined'&&AndroidBridge!==null);
function $(id){return document.getElementById(id);}
function fmtBalls(bs,cls){return (bs||[]).map(function(n){return '<span class="ball '+cls+'">'+n+'</span>';}).join('');}
function fmtHBalls(bs,cls){return (bs||[]).map(function(n){return '<span class="hball '+cls+'">'+n+'</span>';}).join('');}
function heatColor(v,max){var t=Math.max(0,Math.min(1,v/(max||1)));var r=Math.round(235-165*t),g=Math.round(215-110*t),b=Math.round(200-120*t);return 'rgb('+r+','+g+','+b+')';}

var SEL={game:'dlt', play:'fu', front:[], back:[], danFront:[], danBack:[], extra:false, condMode:false, fushiView:false, cond:{must:'', ban:'', oddEven:'', backMust:'', backBan:'', z1:'', z2:'', z3:'', z4:'', l1:false, l2:false, l3:false, l4:false, noLian:false, genN:3}};
function combo(n,k){if(k<0||k>n)return 0;k=Math.min(k,n-k);var r=1;for(var i=0;i<k;i++){r=r*(n-i)/(i+1);}return Math.round(r);}
function pickN(max,n){var all=[];for(var i=1;i<=max;i++)all.push(i);for(var j=all.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1));var t=all[j];all[j]=all[r];all[r]=t;}return all.slice(0,n).sort(function(a,b){return a-b;});}
function calcZhu(){
  var dlt=SEL.game==='dlt';
  var fNeed=dlt?5:6, bNeed=dlt?2:1;
  if(SEL.play==='dan'){
    var df=SEL.danFront.length, ft=SEL.front.length;
    var db=SEL.danBack.length, bt=SEL.back.length;
    if(!dlt){db=0;bt=SEL.back.length;}
    if(df>=fNeed||db>=bNeed||df+ft<fNeed||db+bt<bNeed) return {z:0,msg:'胆码需少于基本数，胆+拖\u2265基本数'};
    return {z:combo(ft,fNeed-df)*combo(bt,bNeed-db),msg:''};
  }
  var f=SEL.front.length,b=SEL.back.length;
  if(f<fNeed||b<bNeed) return {z:0,msg:'未达基本数'};
  return {z:combo(f,fNeed)*combo(b,bNeed),msg:''};
}
function resetSel(g){
  SEL.game=g; SEL.play='fu'; SEL.front=[]; SEL.back=[]; SEL.danFront=[]; SEL.danBack=[]; SEL.extra=false; SEL.cond={must:'',ban:'',oddEven:'',backMust:'',backBan:'',z1:'',z2:'',z3:'',z4:'',l1:false,l2:false,l3:false,l4:false,noLian:false,genN:3};
  renderSelect();
}
function renderFushi(){
  var g=DATA.games[G], html='';
  html+='<div class="switch">';
  ['dlt','ssq'].forEach(function(k){html+='<button class="'+(k===G?'on':'')+'" onclick="G=\''+k+'\';renderFushi();">'+DATA.games[k].meta.name+'</button>';});
  html+='</div>';
  var f=g.fushi;
  if(!f||!f.plans||!f.plans.length){
    html+='<div class="card"><div class="empty">暂无复式方案，请在电脑端运行 gen_fushi.py 生成后重新导出数据。</div></div>';
    $('tab-select').innerHTML=html; return;
  }
  html+='<div class="card"><h2><span class="c-grad-gold">复式选号</span> <span class="tag">'+f.period+'期</span></h2>';
  html+='<div class="note" style="font-size:12px;">自动组合容错覆盖，注数与金额已算。'+f.src+'。</div>';
  f.plans.forEach(function(p){
    var fballs=p.front.map(function(n){return '<span class="mball r">'+n+'</span>';}).join(' ');
    var bballs=p.back.map(function(n){return '<span class="mball b">'+n+'</span>';}).join(' ');
    html+='<div class="combo-group"><div class="combo-title"><span class="c-grad-gold">'+p.tag+'档</span> <span class="tag">'+p.zhu+'注 · <span class="c-green">'+p.cost+'元'+(p.cost3?'（追加<span class="c-orange">'+p.cost3+'元</span>）':'')+'</span></span></div>';
    html+='<div style="font-size:13.5px;line-height:2;color:#eef3ff;font-weight:600;">前区：'+fballs+'<br/>后区：'+bballs+'</div>';
    html+='</div>';
  });
  html+='</div>';
  html+='<div class="sel-btns"><button class="sel-btn" onclick="SEL.fushiView=false;renderSelect();">返回自助选号</button></div>';
  $('tab-select').innerHTML=html;
}

function renderSelect(){
  if(SEL.fushiView){ renderFushi(); return; }
  var g=DATA.games[SEL.game], m=g.meta;
  var dlt=SEL.game==='dlt';
  var frontMax=dlt?35:33, backMax=dlt?12:16;
  var fNeed=dlt?5:6, bNeed=dlt?2:1;
  var html='';
  html+='<div class="switch">';
  ['dlt','ssq'].forEach(function(k){html+='<button class="'+(k===SEL.game?'on':'')+'" onclick="resetSel(\''+k+'\')">'+DATA.games[k].meta.name+'</button>';});
  html+='</div>';
  html+='<div class="switch">';
  [['fu','单式'],['fs','复式'],['dan','胆拖']].forEach(function(p){html+='<button class="'+(SEL.play===p[0]?'on':'')+'" onclick="SEL.play=\''+p[0]+'\';SEL.condMode=false;SEL.fushiView=false;renderSelect();">'+p[1]+'</button>';});
  html+='<button class="'+(SEL.condMode?'on':'')+'" onclick="SEL.condMode=!SEL.condMode;SEL.fushiView=false;renderSelect();">条件选号</button>';
  html+='<button class="'+(SEL.fushiView?'on':'')+'" onclick="SEL.fushiView=true;SEL.condMode=false;renderSelect();">复式选号</button>';
  html+='</div>';
  html+='<div class="card"><h2>'+m.name+' 自助选号 <span class="tag">'+(dlt?('前区'+fNeed+'·后区'+bNeed):('红球'+fNeed+'·蓝球'+bNeed))+'</span></h2>';
  if(SEL.play==='dan'){
    html+='<div class="pickline"><div class="lab">'+m.frontName+'胆</div><div class="pick-grid">';
    for(var i=1;i<=frontMax;i++){html+='<div class="pick r'+(SEL.danFront.indexOf(i)>=0?' on':'')+'" onclick="toggleDan(\'danFront\','+i+','+fNeed+')">'+i+'</div>';}
    html+='</div></div>';
    html+='<div class="pickline"><div class="lab">'+m.frontName+'拖</div><div class="pick-grid">';
    for(var i=1;i<=frontMax;i++){html+='<div class="pick r'+(SEL.front.indexOf(i)>=0?' on':'')+'" data-n="'+i+'" onclick="togglePick(\'front\','+i+')">'+i+'</div>';}
    html+='</div></div>';
    if(dlt){
      html+='<div class="pickline"><div class="lab">'+m.backName+'胆</div><div class="pick-grid">';
      for(var i=1;i<=backMax;i++){html+='<div class="pick b'+(SEL.danBack.indexOf(i)>=0?' on':'')+'" onclick="toggleDan(\'danBack\','+i+','+bNeed+')">'+i+'</div>';}
      html+='</div></div>';
    }
    html+='<div class="pickline"><div class="lab">'+m.backName+(dlt?'拖':'')+'</div><div class="pick-grid">';
    for(var i=1;i<=backMax;i++){html+='<div class="pick b'+(SEL.back.indexOf(i)>=0?' on':'')+'" data-n="'+i+'" onclick="togglePick(\'back\','+i+')">'+i+'</div>';}
    html+='</div></div>';
  } else {
    html+='<div class="pickline"><div class="lab">'+m.frontName+'</div><div class="pick-grid">';
    for(var i=1;i<=frontMax;i++){html+='<div class="pick r'+(SEL.front.indexOf(i)>=0?' on':'')+'" onclick="togglePick(\'front\','+i+')">'+i+'</div>';}
    html+='</div></div>';
    html+='<div class="pickline"><div class="lab">'+m.backName+'</div><div class="pick-grid">';
    for(var i=1;i<=backMax;i++){html+='<div class="pick b'+(SEL.back.indexOf(i)>=0?' on':'')+'" data-n="'+i+'" onclick="togglePick(\'back\','+i+')">'+i+'</div>';}
    html+='</div></div>';
  }
  var res=calcZhu(); var z=res.z;
  var price=dlt?(SEL.extra?3:2):2;
  if(dlt){
    html+='<div class="fb-box" style="display:flex;align-items:center;gap:10px;padding:10px 12px;"><label style="font-size:13px;color:#dbe8ff;">追加投注（+1元/注，中浮动奖更多）</label><input type="checkbox" '+(SEL.extra?'checked':'')+' onchange="SEL.extra=this.checked;renderSelect();" style="width:20px;height:20px;flex-shrink:0;"></div>';
  }
  var df=SEL.danFront.length, ft=SEL.front.length, db=SEL.danBack.length, bt=SEL.back.length;
  var shown=SEL.play==='dan'?('胆 '+df+'拖 '+ft+' · 胆 '+db+'拖 '+bt):(z>0?('选 '+SEL.front.length+'·'+SEL.back.length):res.msg);
  html+='<div class="fb-box"><div class="fb-top"><span>已选</span><span>'+shown+'</span></div>';
  if(SEL.play==='dan'){
    html+='<div>'+m.frontName+': <b>胆['+(SEL.danFront.join(',')||'无')+'] 拖['+(SEL.front.join(',')||'无')+']</b></div>';
    if(dlt){html+='<div>'+m.backName+': <b>胆['+(SEL.danBack.join(',')||'无')+'] 拖['+(SEL.back.join(',')||'无')+']</b></div>';}
    else{html+='<div>'+m.backName+': <b>'+(SEL.back.join(',')||'未选')+'</b></div>';}
  } else {
    html+='<div>'+m.frontName+': <b>'+(SEL.front.join(',')||'未选')+'</b></div>';
    html+='<div>'+m.backName+': <b>'+(SEL.back.join(',')||'未选')+'</b></div>';
  }
  html+='<div>注数: <b class="c-cyan">'+z+'</b> 注 · 金额 <b class="c-green">'+(z*price)+'</b> 元'+(dlt&&SEL.extra?'（<span class="c-orange">含追加</span>）':'')+'</div></div>';
  html+='<div class="sel-btns">';
  html+='<button class="sel-btn p" onclick="randomPick()">随机一注</button>';
  html+='<button class="sel-btn" onclick="resetSel(\''+SEL.game+'\')">清空</button>';
  html+='</div>';
  html+='<div class="note" style="font-size:12px;">单式=基本数1注；复式=超出自动算注；胆拖=胆码+拖码组合自动算注。理性购彩。</div>';
  // ===== 自设条件选号面板（升级版12项条件）=====
  if(SEL.condMode){
    html+='<div class="card"><h2>自设条件选号 <span class="tag">12项智能筛选</span></h2>';
    html+='<div class="cond-form">';
    // --- 前区条件 ---
    html+='<div class="cond-group"><div class="cond-group-title">前区条件</div>';
    html+='<div class="cond-row"><label>必含</label><input type="text" class="cond-input" placeholder="如: 2,6 或 带2" value="'+SEL.cond.must+'" onchange="SEL.cond.must=this.value;"></div>';
    html+='<div class="cond-row"><label>排除</label><input type="text" class="cond-input" placeholder="如: 5,15,25" value="'+SEL.cond.ban+'" onchange="SEL.cond.ban=this.value;"></div>';
    html+='<div class="cond-row"><label>奇偶比</label><select class="cond-input" onchange="SEL.cond.oddEven=this.value;"><option value="">不限</option>';
    var oeOpts=dlt?['3:2','2:3','4:1','1:4','5:0','0:5']:['3:3','4:2','2:4','5:1','1:5','6:0','0:6'];
    oeOpts.forEach(function(o){html+='<option value="'+o+'"'+(SEL.cond.oddEven===o?' selected':'')+'>'+o+'</option>';});
    html+='</select></div></div>';
    // --- 后区条件 ---
    html+='<div class="cond-group"><div class="cond-group-title">后区条件</div>';
    html+='<div class="cond-row"><label>必含</label><input type="text" class="cond-input" placeholder="如: 3,7" value="'+SEL.cond.backMust+'" onchange="SEL.cond.backMust=this.value;"></div>';

    html+='<button class="sel-btn p" style="width:100%;margin-top:8px;" onclick="genByCondition()">根据条件生成号码</button>';

// ===== 自设条件选号：条件解析 + 号码生成 =====
function parseNumList(str, max){
  if(!str) return [];
  // v7.2: 支持数组输入
  if(Array.isArray(str)){ return str.filter(function(x){ var v=parseInt(x); return !isNaN(v)&&v>=1&&v<=max; }).map(Number); }
  str = String(str).trim();
  var nums = [];
  if(str.indexOf('带') === 0){
    var d = parseInt(str.replace('带',''));
    for(var i=1;i<=max;i++){ if((i%10)===d) nums.push(i); }
  } else {
    // 支持中英文逗号、顿号、空格、分号、点号、竖线等多种分隔符
    str.split(/[,，、；;\s\.\|]+/).forEach(function(x){ var v=parseInt(x); if(!isNaN(v)&&v>=1&&v<=max) nums.push(v); });
  }
  return nums;
}
function parseBackCond(str, max){
  if(!str) return {type:'any', vals:[]};
  str = str.trim();
  if(str.indexOf('>=')===0) return {type:'gte', val:parseInt(str.substr(2))};
  if(str.indexOf('<=')===0) return {type:'lte', val:parseInt(str.substr(2))};
  if(str.indexOf('>')===0) return {type:'gt', val:parseInt(str.substr(1))};
  if(str.indexOf('<')===0) return {type:'lt', val:parseInt(str.substr(1))};
  return {type:'in', vals:parseNumList(str, max)};
}
function checkBackCond(balls, cond){
  if(cond.type==='any') return true;
  if(cond.type==='gt') return balls.every(function(b){return b>cond.val;});
  if(cond.type==='lt') return balls.every(function(b){return b<cond.val;});
  if(cond.type==='gte') return balls.every(function(b){return b>=cond.val;});
  if(cond.type==='lte') return balls.every(function(b){return b<=cond.val;});
  if(cond.type==='in') return cond.vals.every(function(v){return balls.indexOf(v)>=0;});
  return true;
}
function genByCondition(){
  var g=DATA.games[SEL.game];
  var dlt=SEL.game==='dlt';
  var frontMax=dlt?35:33, backMax=dlt?12:16;
  var fNeed=dlt?5:6, bNeed=dlt?2:1;
  var c=SEL.cond;
  // 解析前区条件
  var mustNums = parseNumList(c.must, frontMax);
  var banNums = parseNumList(c.ban, frontMax);
  var oddEven = c.oddEven ? c.oddEven.split(':').map(Number) : null;
  // 解析后区条件
  var backMust = parseNumList(c.backMust, backMax);
  var backBan = parseNumList(c.backBan, backMax);
  // 区间个数
  var zCnt = [c.z1?parseInt(c.z1):-1, c.z2?parseInt(c.z2):-1, c.z3?parseInt(c.z3):-1, c.z4?parseInt(c.z4):-1];
  // 连号条件
  var lianReq = [c.l1, c.l2, c.l3, c.l4];
  // 候选池
  var pool = {};
  g.predictions.items.forEach(function(it){ (it.front||[]).forEach(function(n){pool[n]=(pool[n]||0)+1;}); });
  var hist = g.history||[];
  if(hist.length>0){ hist.slice(-50).forEach(function(row){ (row.front||[]).forEach(function(n){pool[n]=(pool[n]||0)+0.3;}); }); }
  var candidates = Object.keys(pool).map(Number).filter(function(n){return banNums.indexOf(n)<0;})
    .sort(function(a,b){return (pool[b]-pool[a])||(a-b);});
  // 候选池补充：若某些区间无候选号，从全部号码（排除排除号）中补充，避免区间条件无法满足
  var allNums=[]; for(var _ai=1;_ai<=frontMax;_ai++){if(banNums.indexOf(_ai)<0)allNums.push(_ai);}
  var missingZone=[false,false,false,false];
  candidates.forEach(function(n){var z=n<=10?0:(n<=20?1:(n<=30?2:3));missingZone[z]=true;});
  for(var _zi=0;_zi<4;_zi++){
    if(!missingZone[_zi]){
      var zoneNums=allNums.filter(function(n){return (_zi===0&&n<=10)||(_zi===1&&n>10&&n<=20)||(_zi===2&&n>20&&n<=30)||(_zi===3&&n>30);});
      candidates=candidates.concat(zoneNums);
    }
  }
  var mustValid = mustNums.filter(function(n){return banNums.indexOf(n)<0;});
  if(mustValid.length > fNeed){
    document.getElementById('cond-result').innerHTML='<div class="cond-err">必含号码超过'+fNeed+'个，请减少</div>'; return;
  }
  // 区间个数总和检查
  var zSum = zCnt.filter(function(x){return x>=0;}).reduce(function(a,b){return a+b;},0);
  if(zSum > fNeed){
    document.getElementById('cond-result').innerHTML='<div class="cond-err">区间个数总和超过'+fNeed+'个，请调整</div>'; return;
  }
  // 后区必含检查
  if(backMust.length > bNeed){
    document.getElementById('cond-result').innerHTML='<div class="cond-err">后区必含超过'+bNeed+'个，请减少</div>'; return;
  }
  // 辅助函数：判断区间
  function zoneOf(n){ if(n<=10)return 0; if(n<=20)return 1; if(n<=30)return 2; return 3; }
  // 辅助函数：判断某区间是否有连号
  function hasLianInZone(nums, zi){
    var zNums = nums.filter(function(n){return zoneOf(n)===zi;}).sort(function(a,b){return a-b;});
    for(var i=0;i<zNums.length-1;i++){ if(zNums[i+1]-zNums[i]===1) return true; }
    return false;
  }
  // 生成号码
  var results = [], tried = {}, maxTry = 1000, genN = c.genN||3;
  for(var t=0;t<maxTry && results.length<genN;t++){
    // 前区：必含号 + 候选池
    var front = mustValid.slice();
    var pool2 = candidates.filter(function(n){return front.indexOf(n)<0;});
    for(var i=pool2.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=pool2[i];pool2[i]=pool2[j];pool2[j]=tmp;}
    var topN = Math.min(pool2.length, Math.max(12, fNeed*3));
    var topPool = pool2.slice(0, topN);
    while(front.length < fNeed && topPool.length>0){
      front.push(topPool.splice(Math.floor(Math.random()*topPool.length),1)[0]);
    }
    if(front.length < fNeed) continue;
    front.sort(function(a,b){return a-b;});
    // 奇偶比检查
    if(oddEven){
      var odd = front.filter(function(x){return x%2===1;}).length;
      if(odd !== oddEven[0]) continue;
    }
    // 区间个数检查
    var zActual = [0,0,0,0];
    front.forEach(function(n){ zActual[zoneOf(n)]++; });
    var zOk = true;
    for(var zi=0;zi<4;zi++){ if(zCnt[zi]>=0 && zActual[zi]!==zCnt[zi]){ zOk=false; break; } }
    if(!zOk) continue;
    // 连号检查
    var lOk = true;
    for(var li=0;li<4;li++){ if(lianReq[li] && !hasLianInZone(front, li)){ lOk=false; break; } }
    if(!lOk) continue;
    // 全局无连号检查
    if(c.noLian){
      var sortedF=front.slice().sort(function(a,b){return a-b;});
      var hasAnyLian=false;
      for(var _li=0;_li<sortedF.length-1;_li++){ if(sortedF[_li+1]-sortedF[_li]===1){ hasAnyLian=true; break; } }
      if(hasAnyLian) continue;
    }
    // 后区：必含 + 候选
    var back = backMust.slice();
    var backCands = [];
    for(var b=1;b<=backMax;b++){
      if(backBan.indexOf(b)>=0) continue;
      if(back.indexOf(b)>=0) continue;
      backCands.push(b);
    }
    while(back.length<bNeed && backCands.length>0){
      back.push(backCands.splice(Math.floor(Math.random()*backCands.length),1)[0]);
    }
    if(back.length < bNeed) continue;
    back.sort(function(a,b){return a-b;});
    var key = front.join(',')+'+'+back.join(',');
    if(tried[key]) continue;
    tried[key]=true;
    results.push({front:front, back:back});
  }
  // 展示结果
  var html='';
  if(results.length===0){
    html='<div class="cond-err">未找到符合条件的号码组合，请放宽条件（检查区间个数/连号/必含是否冲突）</div>';
  } else {
    html='<div class="cond-results">';
    results.forEach(function(r, idx){
      var fBalls=r.front.map(function(n){return '<span class="mball r">'+n+'</span>';}).join('');
      var bBalls=r.back.map(function(n){return '<span class="mball b">'+n+'</span>';}).join('');
      html+='<div class="cond-result-row"><span class="cno">'+(idx+1)+'</span>'+fBalls+'<span class="cplus">+</span>'+bBalls;
      html+='<button class="cond-add" onclick="addCondToSel('+idx+')">加入选号</button></div>';
    });
    html+='</div>';
    window._condResults = results;
  }
  document.getElementById('cond-result').innerHTML=html;
}

    }
    html+='<div>注数: <b>'+z+'</b> 注 · 金额 <b>'+(z*price)+'</b> 元'+(dlt&&SEL.extra?'（含追加）':'')+'</div>';

    })
    .catch(function(){ if(msg){msg.textContent='✗ 无法连接服务器查询状态，请检查电脑IP与WiFi'; msg.style.color='#c62828';} });

function renderPatternCard(g){

  // 区间流向
  var zt=pat['区间占比']&&pat['区间占比']['前区流向']?pat['区间占比']['前区流向']:[];

function genReviewPack(){
  var cfg=loadCfg();
  var msg=document.getElementById('rv-msg');
  if(!cfg.remoteBase){ if(msg){msg.textContent='请先在「关于」页配置远程服务器地址'; msg.style.color='#c62828';} return; }
  if(msg){msg.textContent='正在生成研判数据包（发送豆包/DeepSeek/ChatGPT 三方，约30-90秒）...'; msg.style.color='#c8891f';}
  fetchWithTimeout(cfg.remoteBase.replace(/\/$/,'')+'/review_pack?token=kcyc2026&game='+(G==='dlt'?'dlt':'ssq'), 15000, {method:'POST'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.status==='started'||d.status==='busy'){
        pollReviewStatus(msg, 0);
      } else if(msg){ msg.textContent='生成失败：'+(d.msg||d.status); msg.style.color='#c62828'; }
    })
    .catch(function(e){ if(msg){msg.textContent='✗ 无法连接服务器：'+e.message; msg.style.color='#c62828';} });
}
function pollReviewStatus(msg, tick){
  if(tick>24){ if(msg)msg.textContent='已等待约2分钟，请稍后在「关于」页点立即同步数据查看结果'; return; }
  var cfg=loadCfg();
  if(!cfg.remoteBase) return;
  fetchWithTimeout(cfg.remoteBase.replace(/\/$/,'')+'/review/status', 8000)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.running){ if(msg)msg.textContent='研判数据包生成中...（已等待约'+Math.round((tick+1)*8/60*10)/10+'分钟）'; setTimeout(function(){ pollReviewStatus(msg, tick+1); }, 8000); }
      else if(d.result){
        if(d.result.status==='done'){ if(msg){msg.textContent='✓ 研判数据包已生成（耗时'+d.result.elapsed+'秒），正在拉取最新研判数据...'; msg.style.color='#2e7d32';} syncNowSilent(); }
        else { if(msg){msg.textContent='生成未成功：'+(d.result.msg||d.result.status||d.result.output||'').slice(0,120); msg.style.color='#c62828';} }
      }
      else { if(msg)msg.textContent='服务器暂无生成记录，请确认电脑端已运行'; }
    })
    .catch(function(){ if(msg){msg.textContent='✗ 查询失败，请检查WiFi与服务器'; msg.style.color='#c62828';} });
}


function modelColor(name){
  name=name||'';
  if(name.indexOf('贝叶斯')>=0)return 'mn-bayes';
  if(name.indexOf('马尔可夫')>=0)return 'mn-markov';
  if(name.indexOf('LSTM')>=0||name.indexOf('时序')>=0||name.indexOf('深度')>=0||name.indexOf('Transformer')>=0)return 'mn-lstm';
  if(name.indexOf('统计')>=0||name.indexOf('遗漏')>=0||name.indexOf('指数')>=0||name.indexOf('频率')>=0)return 'mn-stats';
  if(name.indexOf('智能')>=0||name.indexOf('AI')>=0||name.indexOf('集成')>=0||name.indexOf('共现')>=0||name.indexOf('GBDT')>=0)return 'mn-ai';
  if(name.indexOf('融合')>=0||name.indexOf('DeepSeek')>=0)return 'mn-fusion';
  if(name.indexOf('自适应')>=0)return 'mn-engine';
  return '';
}

function bridgeHttp(method, url){
  return new Promise(function(res, rej){
    try{
      var r = (method==='POST') ? AndroidBridge.httpPost(url) : AndroidBridge.httpGet(url);
      if(r && r.indexOf('__KCYC_HTTP_OK__')===0){
        var nl = r.indexOf('\n');
        var body = (nl>=0)?r.substring(nl+1):'';
        var status = parseInt(r.substring('__KCYC_HTTP_OK__'.length, nl>=0?nl:r.length),10)||200;
        res({ok:status>=200&&status<300, status:status,
             text:function(){ return Promise.resolve(body); },
             json:function(){ return Promise.resolve(JSON.parse(body)); }});
      } else if(r && r.indexOf('__KCYC_HTTP_ERR__')===0){
        rej(new Error(r.substring('__KCYC_HTTP_ERR__'.length, 160)));
      } else {
        rej(new Error('bridge returned unknown response'));
      }
    }catch(e){ rej(e); }
  });
}
function fetchWithTimeout(url, ms, opts){
  opts = opts || {};
  // APK 内优先走 AndroidBridge 原生 HTTP 通道（绕过 WebView 网络限制）
  if(HAS_NATIVE_BRIDGE){
    var _method = opts.method || 'GET';
    var _resp = null, _ok = false;
    try{
      _resp = bridgeHttp(_method, url);
      _ok = true;
    }catch(e){}
    if(_ok){
      return Promise.race([
        _resp,
        new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms||5000); })
      ]).catch(function(e){
        // 原生通道失败 → 回退标准 fetch
        return Promise.race([
          fetch(url,{cache:'no-store', method:_method}),
          new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms||5000); })
        ]);
      });
    }
  }
  return Promise.race([
    fetch(url,{cache:'no-store', method:opts.method||'GET'}),
    new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms||5000); })
  ]);
}

function loadData(){
  if(typeof EMBEDDED_DATA!=='undefined'&&EMBEDDED_DATA){
    // 内嵌模式：首屏秒开内置数据，同时后台自动检查同步（打开即自动更新）
    setTimeout(function(){ autoSyncCheck(true); }, 800);
    return Promise.resolve(EMBEDDED_DATA);
  }
  if(HAS_NATIVE_BRIDGE){
    try{
      var raw=AndroidBridge.readAssetFile('data/app_data.json');
      if(raw&&raw.length>10){ return Promise.resolve(JSON.parse(raw)); }
    }catch(e){}
  }
  var cfg=loadCfg();
  var cached=null;
  try{ cached=JSON.parse(localStorage.getItem(cfg.dataKey)); }catch(e){}
  function fallback(){
    if(cached) return cached;
    if(window.__APP_DATA__) return window.__APP_DATA__;
    return fetch('data/app_data.json').then(function(r){ if(!r.ok){throw new Error('HTTP '+r.status);} return r.json(); });
  }
  var _bases=[];
  if(cfg.remoteBase){ _bases.push(cfg.remoteBase); }
  try{ if(DATA&&DATA.update&&DATA.update.defaultRemote){ var _dr=DATA.update.defaultRemote; if(_dr&&_bases.indexOf(_dr)<0){ _bases.push(_dr); } } }catch(e){}
  if(_bases.length){
    var _bi=0;
    function _tryNext(){
      if(_bi>=_bases.length){ return fallback(); }
      var _b=_bases[_bi++];
      return fetchWithTimeout(_b.replace(/\/$/,'')+'/app_data.json?t='+Date.now(), 4000)
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(d){
          try{ localStorage.setItem(cfg.dataKey, JSON.stringify(d)); }catch(e){}
          cfg.remoteBase=_b; cfg.lastSync=d.generated||''; cfg.lastSyncSource='remote'; saveCfg(cfg);
          return d;
        })
        .catch(function(){ return _tryNext(); });
    }
    return _tryNext();
  }
  return Promise.resolve().then(fallback);
}

    .catch(function(){ return null; });
}

function showToast(msg, dur){
  if(HAS_NATIVE_BRIDGE){ try{ AndroidBridge.toast(msg); }catch(e){} }
  var t=document.getElementById('app-toast');
  if(!t){ t=document.createElement('div'); t.id='app-toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); }, dur||2500);
}
function autoDiscoverBases(){
  // 同 WiFi 自动发现：通过 AndroidBridge 原生引擎并发扫描局域网 8000 端口
  return new Promise(function(resolve){
    if(!HAS_NATIVE_BRIDGE || !window.AndroidBridge || typeof AndroidBridge.discoverServer!=='function'){ resolve([]); return; }
    var ips=[];
    try{
      var r=AndroidBridge.discoverServer(8000);
      if(r && r.indexOf('OK|')===0){
        var arr=r.substring(3).split(',');
        for(var i=0;i<arr.length;i++){ var x=arr[i].trim(); if(x && ips.indexOf('http://'+x+':8000')<0){ ips.push('http://'+x+':8000'); } }
      }
    }catch(e){}
    if(!ips.length){
      try{
        var lip=AndroidBridge.getLocalIp();
        if(lip && lip!=='0.0.0.0'){ var pre=lip.substring(0, lip.lastIndexOf('.')+1); var gw=pre+'1'; if(lip!==gw){ ips.push('http://'+gw+':8000'); } }
      }catch(e2){}
    }
    resolve(ips);
  });
}
function autoSyncCheck(silent){
  var cfg=loadCfg();
  var _bases=[];
  if(cfg.remoteBase){ _bases.push(cfg.remoteBase); }
  try{ if(DATA&&DATA.update&&DATA.update.defaultRemote){ var _dr=DATA.update.defaultRemote; if(_dr&&_bases.indexOf(_dr)<0){ _bases.push(_dr); } } }catch(e){}
  var _bi=0;
  function _tryOne(){
    if(_bi>=_bases.length){ return _tryDiscover(silent); }
    var _b=_bases[_bi++];
    return fetchWithTimeout(_b.replace(/\/$/,'')+'/version.json', 4000)
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(v){
        if(!v || !v.dataGenerated) return Promise.resolve(false);
        var cur = (DATA && DATA.generated) ? DATA.generated : '';
        // 服务器数据比当前新 → 自动拉取并刷新
        if(v.dataGenerated !== cur){
          return fetchWithTimeout(_b.replace(/\/$/,'')+'/app_data.json?t='+Date.now(), 6000)
            .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
            .then(function(d){
              try{ localStorage.setItem(cfg.dataKey, JSON.stringify(d)); }catch(e){}
              cfg.remoteBase=_b; cfg.lastSync=d.generated||''; cfg.lastSyncSource='remote'; saveCfg(cfg);
              DATA=d;
              $('hd-sub').textContent='已自动同步 '+d.generated+' · 大乐透'+d.games.dlt.meta.latestPeriod+' / 双色球'+d.games.ssq.meta.latestPeriod;
              try{ renderPred(); renderSelect(); renderHist(); renderFushi(); renderBt(); renderVerify(); renderAbout(); }catch(e){ try{console.error('render err',e);}catch(_e){} }
              showToast('✓ 数据已自动更新至 '+d.generated, 3000);
              return Promise.resolve(true);
            });
        }
        return Promise.resolve(false);
      })
      .catch(function(){ return _tryOne(); });
  }
  function _tryDiscover(silent2){
    return autoDiscoverBases().then(function(bases){
      if(!bases.length){ if(!silent2)showToast('未找到局域网服务器，请确认电脑已启动数据服务且手机与电脑同一WiFi'); return Promise.reject(new Error('conn-fail')); }
      var _di=0;
      function _dTry(){
        if(_di>=bases.length){ if(!silent2)showToast('自动同步失败：服务器未响应'); return Promise.reject(new Error('conn-fail')); }
        var _b=bases[_di++];
        return fetchWithTimeout(_b.replace(/\/$/,'')+'/version.json', 4000)
          .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
          .then(function(v){
            if(!v || !v.dataGenerated) return _dTry();
            var cur = (DATA && DATA.generated) ? DATA.generated : '';
            if(v.dataGenerated !== cur){
              return fetchWithTimeout(_b.replace(/\/$/,'')+'/app_data.json?t='+Date.now(), 6000)
                .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
                .then(function(d){
                  try{ localStorage.setItem(cfg.dataKey, JSON.stringify(d)); }catch(e){}
                  cfg.remoteBase=_b; cfg.lastSync=d.generated||''; cfg.lastSyncSource='discover'; saveCfg(cfg);
                  DATA=d;
                  $('hd-sub').textContent='已自动发现电脑服务器并同步 '+d.generated+' · 大乐透'+d.games.dlt.meta.latestPeriod+' / 双色球'+d.games.ssq.meta.latestPeriod;
                  try{ renderPred(); renderSelect(); renderHist(); renderFushi(); renderBt(); renderVerify(); renderAbout(); }catch(e){ try{console.error('render err',e);}catch(_e){} }
                  showToast('✓ 已自动连接电脑服务器，数据更新至 '+d.generated, 3000);
                  return Promise.resolve(true);
                });
            }
            return Promise.resolve(false);
          })
          .catch(function(){ return _dTry(); });
      }
      return _dTry();
    });
  }
  return _tryOne();
}

// v1.5.7 全自动更新：无新数据可拉取（服务器数据=本地数据）但数据已过期（非今天生成）时，自动触发电脑端更新，完成后自动同步
// 频率控制：距上次自动触发不足 3 小时则跳过（避免频繁触发电脑端全量运算）
var _autoTrigKey='kcyc_autotrig';
function autoTriggerUpdate(){
  var cfg=loadCfg();
  if(!cfg.remoteBase) return;
  var last=0; try{ last=Number(localStorage.getItem(_autoTrigKey))||0; }catch(e){}
  var now=Date.now();
  if(now-last < 3*3600*1000) return;
  fetchWithTimeout(cfg.remoteBase.replace(/\/$/,'')+'/version.json', 4000)
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(v){
      if(!v||!v.dataGenerated) return;
      var cur=(DATA&&DATA.generated)?DATA.generated:'';
      if(v.dataGenerated!==cur) return;  // 服务器有新数据 → 交给 autoSyncCheck 拉取即可，无需触发
      var genDate=new Date(v.dataGenerated.replace(' ','T'));
      var today=new Date(); today.setHours(0,0,0,0);
      if(!isNaN(genDate.getTime()) && genDate.getTime() >= today.getTime()) return;  // 今天已生成 → 最新，无需触发
      try{ localStorage.setItem(_autoTrigKey, String(now)); }catch(e){}
      // 静默提交电脑端更新（默认令牌 kcyc2026，局域网内使用）
      fetchWithTimeout(cfg.remoteBase.replace(/\/$/,'')+'/update?token=kcyc2026&game=all', 15000, {method:'POST'})
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(d.status==='started'||d.status==='busy'){ pollUpdateStatus(null, 0); }
          else if(d.status==='done'){ syncNowSilent(); }
        })
        .catch(function(){});
    })
    .catch(function(){});
}

// ===== 下拉刷新（v1.6.6 已取消：不再支持手势下拉更新，避免误触/卡顿；关于栏手动更新按钮保留）=====
var ENABLE_PULL_REFRESH=false;
var _pullStartY=0,_pullDist=0,_pulling=false;
document.addEventListener('touchstart',function(e){
  if(!ENABLE_PULL_REFRESH)return;
  if(window.scrollY<=0){ _pullStartY=e.touches[0].clientY; _pulling=true; }
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(!_pulling)return;
  _pullDist=e.touches[0].clientY-_pullStartY;
  if(_pullDist>0&&_pullDist<120){
    var pr=document.getElementById('pull-refresh');
    var pt=document.getElementById('pr-text');
    var arrow=pr.querySelector('.pr-arrow');
    pr.style.height=_pullDist+'px';
    if(_pullDist>60){ pt.textContent='释放更新'; arrow.style.transform='rotate(180deg)'; }
    else { pt.textContent='下拉刷新'; arrow.style.transform='rotate(0deg)'; }
  }
},{passive:true});
document.addEventListener('touchend',function(){
  if(!_pulling)return; _pulling=false;
  var pr=document.getElementById('pull-refresh');
  if(_pullDist>60){
    pr.style.height='40px';
    document.getElementById('pr-text').textContent='正在更新...';
    doSyncRefresh();
  } else { pr.style.height='0'; }
  _pullDist=0;
});
function doSyncRefresh(){
  var cfg=loadCfg();
  if(!cfg.remoteBase && !HAS_NATIVE_BRIDGE){
    showToast('请先在「关于」页配置远程服务器地址');
    document.getElementById('pull-refresh').style.height='0';
    return;
  }
  showSyncProgress(30);
  autoSyncCheck(false).then(function(ok){
    showSyncProgress(100);
    setTimeout(function(){ showSyncProgress(0); document.getElementById('pull-refresh').style.height='0'; },500);
    if(ok) showToast('✓ 数据已更新到最新');
    else showToast('已是最新数据或连接失败');
  }).catch(function(){
    showSyncProgress(0);
    document.getElementById('pull-refresh').style.height='0';
    showToast('更新失败：无法连接服务器');
  });
}
function showSyncProgress(pct){
  var bar=document.getElementById('sync-progress');
  if(bar) bar.style.width=pct+'%';
}

function startAutoSync(){
  stopAutoSync();
  var cfg=loadCfg();
  var _dr='';
  try{ if(DATA&&DATA.update&&DATA.update.defaultRemote){ _dr=DATA.update.defaultRemote||''; } }catch(e){}
  if(!cfg.autoSync || (!cfg.remoteBase && !_dr)) return;
  var iv=(cfg.autoInterval||300)*1000;
  _autoTimer=setInterval(function(){
    autoSyncCheck(true);
    autoTriggerUpdate();  // v1.5.7 全自动：数据过期时自动触发电脑端更新
  }, iv);
  // 页面从后台切回前台时立即检查一次
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible'){ autoSyncCheck(true); autoTriggerUpdate(); }
  });
  // v1.5.7 打开即自动检测一次触发更新（延迟，等页面渲染稳定）
  setTimeout(function(){ autoTriggerUpdate(); }, 6000);
}
function stopAutoSync(){ if(_autoTimer){ clearInterval(_autoTimer); _autoTimer=null; } }
function toggleAutoSync(el){
  var cfg=loadCfg();
  cfg.autoSync=!cfg.autoSync; saveCfg(cfg);
  el.classList.toggle('on', cfg.autoSync);
  if(cfg.autoSync){ startAutoSync(); showToast('✓ 自动同步已开启（每'+(cfg.autoInterval||300)+'秒检查）'); }
  else{ stopAutoSync(); showToast('自动同步已关闭'); }
}
// ===== 自动更新结束 =====

function saveCfgAndSync(){
  var cfg=loadCfg();
  var v=document.getElementById('cfg-remote').value.trim();
  cfg.remoteBase=v; saveCfg(cfg);
  var msg=document.getElementById('upd-msg');
  if(!v){
    // 未填地址 → 自动发现局域网服务器
    autoDiscoverBases().then(function(bases){
      if(!bases.length){ if(msg)msg.textContent='已清空远程地址。未发现局域网服务器，将使用内置数据；请确认电脑端已启动数据服务。'; return; }
      var _b=bases[0];
      return fetchWithTimeout(_b.replace(/\/$/,'')+'/version.json', 4000)
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(vv){
          if(!vv || !vv.dataGenerated) throw 0;
          return fetchWithTimeout(_b.replace(/\/$/,'')+'/app_data.json?t='+Date.now(), 6000)
            .then(function(r){ if(!r.ok) throw 0; return r.json(); })
            .then(function(d){
              try{ localStorage.setItem(cfg.dataKey, JSON.stringify(d)); }catch(e){}
              cfg.remoteBase=_b; cfg.lastSync=d.generated||''; cfg.lastSyncSource='discover'; saveCfg(cfg);
              DATA=d;
              $('hd-sub').textContent='已自动发现服务器 '+_b+' · 数据 '+d.generated;
              if(msg)msg.textContent='✓ 已自动发现并同步：'+_b+'（数据 '+d.generated+'）';
              renderPred();
            });
        });
    }).catch(function(){ if(msg)msg.textContent='自动发现失败：无法连接局域网服务器。'; });
    return;
  }
  loadData().then(function(d){
    DATA=d;
    $('hd-sub').textContent='已联网同步 '+d.generated+' · 大乐透'+d.games.dlt.meta.latestPeriod+' / 双色球'+d.games.ssq.meta.latestPeriod;
    if(msg)msg.textContent='\u2713 同步成功：数据更新至 '+d.generated+'（大乐透'+d.games.dlt.meta.latestPeriod+' / 双色球'+d.games.ssq.meta.latestPeriod+'）';
    renderPred();
  }).catch(function(){ if(msg)msg.textContent='\u2717 同步失败：无法连接 '+v+'，请确认电脑端已启动 serve_data.py 且手机与电脑同一WiFi。'; });
}
loadData().then(function(d){
  DATA=d;
  var _cfg=loadCfg();
  var _src=(_cfg.lastSyncSource==='remote'?'已联网同步':'更新');
  var _dot=(_cfg.autoSync&&_cfg.remoteBase)?'<span class=\'sync-dot\'></span>':'<span class=\'sync-dot off\'></span>';
  var _syncInfo=_cfg.lastSync?(' · 同步 '+_cfg.lastSync.slice(5,16)):''; $('hd-sub').innerHTML=_dot+_src+' '+d.generated+_syncInfo+' · 大乐透'+d.games.dlt.meta.latestPeriod+' / 双色球'+d.games.ssq.meta.latestPeriod;
  renderPred();
  checkRemoteVersion().then(function(v){
    if(v && DATA && DATA.update && v.version && v.version!==DATA.update.currentVersion){
      var b=document.getElementById('upd-banner'); if(b)b.style.display='block';
      var t=document.getElementById('upd-banner-text');
      if(t)t.textContent='发现新版本 '+v.version+'（当前 '+DATA.update.currentVersion+'）· 数据已自动同步';
    }
  });
  startAutoSync();
}).catch(function(e){
  $('hd-sub').textContent='数据加载失败：请通过 http 服务器访问或重新导出数据';
  $('tab-pred').innerHTML='<div class="empty">无法加载 app_data.json（'+e.message+'）</div>';
});

// PWA 离线缓存（仅 https/localhost 生效，失败不影响使用）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
